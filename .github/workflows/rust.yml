name: HexSpell testing

on:
  push:
    branches:
      - '*'
  pull_request:
    branches:
      - '*'

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Rust
      uses: dtolnay/rust-toolchain@stable
      with:
        components: clippy

    - name: Cache Cargo
      uses: actions/cache@v4
      with:
        path: |
          ~/.cargo/registry
          ~/.cargo/git
          target
        key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock', 'Cargo.toml') }}
        restore-keys: |
          ${{ runner.os }}-cargo-

    - name: Build
      run: cargo build --verbose

    - name: Clippy
      run: cargo clippy --all-targets --verbose -- -D warnings

    - name: Test
      run: cargo test --verbose

    - name: Fuzz harness regression tests
      run: |
        cargo clippy --manifest-path fuzz/Cargo.toml --all-targets --locked -- -D warnings
        cargo test --manifest-path fuzz/Cargo.toml --locked

    - uses: actions/setup-python@v5
      with:
        python-version: '3.12'
    - name: Install independent PE parser
      run: python -m pip install pefile==2024.8.26
    - name: Compare PE fields and structural edits with pefile
      env:
        HEXSPELL_PE_CORPUS: /tmp/hexspell-pe-corpus
      run: |
        python tools/pe-bench/build_corpus.py "$HEXSPELL_PE_CORPUS"
        cargo test --test pefile -- --ignored
    - name: Benchmark harness smoke test
      run: |
        cargo run --release --locked --manifest-path tools/pe-bench/Cargo.toml -- /tmp/hexspell-pe-corpus 1 1
        python tools/pe-bench/pefile_bench.py /tmp/hexspell-pe-corpus --milliseconds 1 --rounds 1

  no-std:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: dtolnay/rust-toolchain@stable
      with:
        components: clippy
        targets: thumbv7em-none-eabi
    - name: Check bare-metal target
      run: cargo check --no-default-features --target thumbv7em-none-eabi
    - name: Clippy without std
      run: cargo clippy --no-default-features --all-targets -- -D warnings
    - name: Test in-memory APIs without std
      run: cargo test --no-default-features
