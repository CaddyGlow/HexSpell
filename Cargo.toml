[package]
name = "caddy-hexspell"
version = "2.0.0"
authors=["Mestre <namestre3@protonmail.com>"]
edition = "2021"
rust-version = "1.88"
description = "Dependency-free Rust library for parsing and patching PE, ELF, and Mach-O executables with a 1:1 on-disk API"
license = "MIT"
repository = "https://github.com/CaddyGlow/HexSpell"
homepage = "https://github.com/CaddyGlow/HexSpell"
documentation = "https://docs.rs/caddy-hexspell"
readme = "README.md"
exclude = ["tests/*", "tools/pe-bench/*", "benches/*", "fuzz/*"]
keywords = ["binary", "executable", "parser", "PE", "ELF" ]
categories = ["development-tools", "parsing"]

[lib]
name = "hexspell"

[features]
default = ["std", "pe", "elf", "macho", "common"]
std = []
pe = []
elf = []
macho = []
common = []
pe-write = ["pe"]

[dev-dependencies]
toml = "1.0" # For testing purpose

[[bench]]
name = "parsing"
harness = false
required-features = ["std", "pe", "elf", "macho", "common"]

[[example]]
name = "pe_hello"
required-features = ["std", "pe-write"]

[[example]]
name = "pe_dll"
required-features = ["std", "pe-write"]

[[example]]
name = "pe_dll_load"
required-features = ["std", "pe-write"]

[[example]]
name = "pe_resources"
required-features = ["std", "pe-write"]
