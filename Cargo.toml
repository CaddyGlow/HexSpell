[package]
name = "caddy-hexspell"
version = "1.2.3"
authors=["Mestre <namestre3@protonmail.com>"]
edition = "2021"
rust-version = "1.88"
description = "Dependency-free Rust library for parsing and patching PE, ELF, and Mach-O executables with a 1:1 on-disk API"
license = "MIT"
repository = "https://github.com/CaddyGlow/HexSpell"
homepage = "https://github.com/CaddyGlow/HexSpell"
documentation = "https://docs.rs/caddy-hexspell"
readme = "README.md"
exclude = ["tests/*", "tools/pe-bench/*", "benches/*", "fuzz/*"]
keywords = ["binary", "executable", "parser", "PE", "ELF" ]
categories = ["development-tools", "parsing"]

[lib]
name = "hexspell"

[features]
default = ["std", "pe", "elf", "macho", "common"]
std = []
pe = []
elf = []
macho = []
common = []
write = []
pe-reconstruct = []

[dev-dependencies]
toml = "1.0" # For testing purpose

[[bench]]
name = "parsing"
harness = false
required-features = ["std", "pe", "elf", "macho", "common"]

[[example]]
name = "elf_pie"
required-features = ["std", "elf", "write"]

[[example]]
name = "elf_shared"
required-features = ["std", "elf", "write"]

[[example]]
name = "elf_edit"
required-features = ["std", "elf", "write"]

[[example]]
name = "elf_hello"
required-features = ["std", "elf", "write"]

[[example]]
name = "macho_validate"
required-features = ["std", "macho", "write"]

[[example]]
name = "macho_hello"
required-features = ["std", "macho", "write"]

[[example]]
name = "pe_hello"
required-features = ["std", "pe", "write"]

[[example]]
name = "pe_dll"
required-features = ["std", "pe", "write"]

[[example]]
name = "pe_dll_load"
required-features = ["std", "pe", "write"]

[[example]]
name = "pe_resources"
required-features = ["std", "pe", "write"]

[[example]]
name = "macho_dylib"
required-features = ["std", "macho", "write"]

[[example]]
name = "macho_edit"
required-features = ["std", "macho", "write"]

[[example]]
name = "pe_certificates"
required-features = ["std", "pe", "write"]

[[example]]
name = "elf_signature"
required-features = ["std", "elf", "write"]
